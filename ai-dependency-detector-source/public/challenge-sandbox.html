<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval'; worker-src blob:; connect-src 'none'; img-src 'none'; style-src 'none'; form-action 'none'; base-uri 'none'">
  <title>Isolated challenge runner</title>
</head>
<body>
<script>
addEventListener('message', (event) => {
  if (typeof event.data !== 'string' || event.data.length > 5000) return;
  const workerSource = `self.onmessage = (message) => {
    try {
      const implementation = new Function(message.data + '; return normalizeTags;')();
      if (typeof implementation !== 'function') throw new Error('Define normalizeTags(tags).');
      const checks = [
        [[' API ', 'api', 'UI', '', '  ', null, 4], ['api', 'ui']],
        [[], []],
        [['A', 'b', 'a', 'B '], ['a', 'b']],
      ];
      const passed = checks.filter(([input, expected]) => JSON.stringify(implementation(input)) === JSON.stringify(expected)).length;
      self.postMessage({ kind: 'challenge', passed, total: checks.length });
    } catch (error) {
      self.postMessage({ kind: 'challenge', error: String(error.message || error) });
    }
  };`;
  const worker = new Worker(URL.createObjectURL(new Blob([workerSource], { type: 'text/javascript' })));
  const timeout = setTimeout(() => {
    worker.terminate();
    parent.postMessage({ kind: 'challenge', error: 'The code exceeded the 1.5-second sandbox limit.' }, '*');
  }, 1500);
  worker.addEventListener('message', (result) => {
    clearTimeout(timeout);
    worker.terminate();
    parent.postMessage(result.data, '*');
  }, { once: true });
  worker.postMessage(event.data);
});
</script>
</body>
</html>
